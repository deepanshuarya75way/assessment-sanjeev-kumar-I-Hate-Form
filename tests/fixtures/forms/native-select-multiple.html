<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Native Select Multiple Options</title>
</head>
<body>
  <form id="skills-form">
    <label for="preferred-skills">Select your primary programming languages</label>
    <select id="preferred-skills" name="preferredSkills" multiple>
      <option value="ts">TypeScript</option>
      <option value="py">Python</option>
      <option value="js">JavaScript</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="go">Go</option>
    </select>
  </form>
</body>
</html>
