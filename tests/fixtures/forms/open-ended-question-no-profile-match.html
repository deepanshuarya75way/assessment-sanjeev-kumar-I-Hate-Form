<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open-Ended Question (No Direct Profile Match)</title>
</head>
<body>
  <form id="open-question-form">
    <div class="form-group">
      <label for="challenging-bug">Describe a challenging technical problem or bug you solved in your projects, how you diagnosed it, and what you learned.</label>
      <textarea id="challenging-bug" name="challenging_problem" rows="6" placeholder="Share your experience..."></textarea>
    </div>
  </form>
</body>
</html>
