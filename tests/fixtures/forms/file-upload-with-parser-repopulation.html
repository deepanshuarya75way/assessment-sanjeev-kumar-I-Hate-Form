<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload With Parser Repopulation</title>
</head>
<body>
  <form id="greenhouse-style-form">
    <div class="upload-section">
      <label for="ats-resume">Attach Resume</label>
      <input type="file" id="ats-resume" name="resume" accept=".pdf" />
      <div id="upload-status"></div>
    </div>

    <div class="applicant-section">
      <div>
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="firstName" value="" />
      </div>
      <div>
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="lastName" value="" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="" />
      </div>
    </div>
  </form>

  <script>
    const fileInput = document.getElementById("ats-resume");
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files.length > 0) {
        const status = document.getElementById("upload-status");
        status.textContent = "Processing resume: " + fileInput.files[0].name;
        // Simulates ATS resume parser auto-filling / overwriting fields
        setTimeout(() => {
          document.getElementById("first-name").value = "Sanjeev";
          document.getElementById("last-name").value = "Kumar";
          document.getElementById("email").value = "sanjeev1803t@gmail.com";
          status.innerHTML = '<span class="filename-chip">' + fileInput.files[0].name + ' uploaded</span>';
        }, 100);
      }
    });
  </script>
</body>
</html>
