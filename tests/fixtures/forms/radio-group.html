<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radio Group Fixture</title>
</head>
<body>
  <form id="sponsorship-form">
    <fieldset>
      <legend>Will you now or in the future require visa sponsorship?</legend>
      <div>
        <input type="radio" id="sponsorship-yes" name="sponsorship" value="yes">
        <label for="sponsorship-yes">Yes</label>
      </div>
      <div>
        <input type="radio" id="sponsorship-no" name="sponsorship" value="no">
        <label for="sponsorship-no">No</label>
      </div>
    </fieldset>
  </form>
</body>
</html>
