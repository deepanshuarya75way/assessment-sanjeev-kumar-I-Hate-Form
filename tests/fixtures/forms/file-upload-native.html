<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Native File Upload</title>
</head>
<body>
  <form id="upload-form">
    <div class="form-group">
      <label for="resume-file">Resume / CV (PDF, DOCX)</label>
      <input type="file" id="resume-file" name="resume" accept=".pdf,.doc,.docx" required />
    </div>
    <div class="form-group">
      <label for="cover-letter-file">Cover Letter (Optional)</label>
      <input type="file" id="cover-letter-file" name="cover_letter" accept=".pdf,.docx" />
    </div>
  </form>
</body>
</html>
