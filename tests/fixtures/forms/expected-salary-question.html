<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expected Salary &amp; CTC Question</title>
</head>
<body>
  <form id="compensation-form">
    <div class="field-row">
      <label for="expected-ctc">Expected CTC (In Lakhs per annum)*</label>
      <input type="number" id="expected-ctc" name="expected_ctc" placeholder="e.g. 10" required />
      <span class="hint">Please enter your expected annual compensation.</span>
    </div>

    <div class="field-row">
      <label for="current-stipend">Current Monthly Stipend (INR)</label>
      <input type="text" id="current-stipend" name="current_stipend" placeholder="0 if fresher" />
    </div>
  </form>
</body>
</html>
